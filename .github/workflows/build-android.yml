name: Build Android App

on:
  push:
    branches: [ "main", "feature/home-inventory-app-13029512742348965273" ]
  pull_request:
    branches: [ "main", "feature/home-inventory-app-13029512742348965273" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install dependencies
      run: npm ci

    - name: Build Web App
      run: npm run build

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Build Android APK
      working-directory: ./android
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7

    - name: Get current date and time
      id: date
      run: echo "date=$(date +'%Y-%m-%d-%H-%M-%S')" >> $GITHUB_ENV

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/home-inventory-app-13029512742348965273')
      with:
        tag_name: build-${{ env.date }}
        name: Auto-Build Release (${{ env.date }})
        body: |
          Automated Android APK build from the latest commit.
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
        files: android/app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
