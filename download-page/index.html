<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100 font-sans text-gray-900">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden p-8 text-center border border-gray-200">
        <div class="mb-6 flex justify-center">
            <div class="w-24 h-24 bg-blue-500 rounded-3xl flex items-center justify-center shadow-lg transform transition hover:scale-105">
                <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            </div>
        </div>
        <h1 class="text-3xl font-extrabold text-gray-900 mb-2">App Download</h1>
        <p class="text-gray-500 mb-8 leading-relaxed">Download the latest version of our Android application. Enjoy new features and improvements.</p>
        <a href="app-debug.apk" class="inline-flex items-center justify-center w-full px-6 py-4 text-lg font-semibold text-white transition-all duration-200 bg-blue-600 rounded-xl hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-600 shadow-md transform hover:-translate-y-0.5">
            <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            Download APK
        </a>
        <p class="mt-6 text-sm text-gray-400 font-medium">Build Date: <span class="text-gray-500">{{BUILD_DATE}}</span></p>
    </div>
</body>
</html>
